name: Alfa

options:
  bundleIdPrefix: me.congee
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  AlfaKit:
    path: AlfaKit

targets:
  Alfa:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: App
    dependencies:
      - package: AlfaKit
        product: AlfaGeotag
    # Local signing config (DEVELOPMENT_TEAM) — see Config/Local.xcconfig.example.
    # The real Config/Local.xcconfig is gitignored so personal team IDs stay out of the repo.
    configFiles:
      Debug: Config/Local.xcconfig
      Release: Config/Local.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.congee.alfa
        PRODUCT_NAME: Alfa
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"        # iPhone only (decision D3)
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Alfa
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - bluetooth-central
          - location
        NSBluetoothAlwaysUsageDescription: "Alfa connects to your Sony camera over Bluetooth to sync GPS location and time."
        NSLocationWhenInUseUsageDescription: "Alfa uses your location to geotag photos on your Sony camera."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Alfa needs Always access to geotag photos while running in the background."

  # On-device BLE integration tests. Hosted by the Alfa app so they inherit its Bluetooth entitlement, usage strings,
  # and existing permission grant. Drives the real CameraCentral against the AlfaCameraSim mock (running on a Mac).
  # See Tools/ble-integration/README.md. The reconnect test skips itself unless ALFA_RUN_BLE_IT=1 is set.
  AlfaIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/AlfaIntegrationTests
    configFiles:
      Debug: Config/Local.xcconfig
      Release: Config/Local.xcconfig
    dependencies:
      - target: Alfa
      - package: AlfaKit
        product: SonyBLE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.congee.alfa.IntegrationTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Alfa.app/Alfa"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Alfa:
    build:
      targets:
        Alfa: all
        AlfaIntegrationTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AlfaIntegrationTests
    archive:
      config: Release
